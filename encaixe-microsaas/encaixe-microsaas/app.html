<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Encaixe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <aside class="app-sidebar">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <rect x="4" y="6" width="24" height="22" rx="4" stroke-width="1.6"/>
        <path d="M4 13h24" stroke="currentColor" stroke-width="1.6"/>
        <path class="tick" d="m11 20 2.5 2.5L18 18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      Encaixe
    </a>

    <nav class="app-nav">
      <a href="app.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Agenda
      </a>
      <a href="#" onclick="return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c1.2-3.4 4-5 7-5s5.8 1.6 7 5"/></svg>
        Clientes
      </a>
      <a href="#" onclick="return false;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.5-2-3.4-2.3.9a8 8 0 0 0-1.7-1L15 3h-4l-.4 2.4a8 8 0 0 0-1.7 1l-2.3-.9-2 3.4L6.6 11a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.8 1.7 1L11 21h4l.4-2.4c.6-.2 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5Z"/></svg>
        Ajustes
      </a>
    </nav>

    <div class="app-sidebar-foot made-by">Um produto <b>Órbita Sites</b></div>
  </aside>

  <main class="app-main">
    <div class="app-topline">
      <div>
        <div class="app-title">Agenda<span id="negocio-nome"></span></div>
      </div>
      <div class="date-nav">
        <button id="btn-prev" aria-label="Dia anterior">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <span class="current" id="data-atual"></span>
        <button id="btn-next" aria-label="Próximo dia">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <button class="btn btn-primary btn-sm desktop-new-btn" id="btn-novo-desktop">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Novo agendamento
      </button>
    </div>

    <div class="stats-row">
      <div class="stat-cell"><div class="value" id="stat-total">—</div><div class="label">agendamentos no dia</div></div>
      <div class="stat-cell"><div class="value" id="stat-ocupacao">—</div><div class="label">taxa de ocupação</div></div>
      <div class="stat-cell"><div class="value" id="stat-faturamento">—</div><div class="label">faturamento previsto</div></div>
      <div class="stat-cell"><div class="value" id="stat-cancelados">—</div><div class="label">cancelamentos</div></div>
    </div>

    <div class="ai-card" id="ai-card">
      <div class="ai-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M3 12h3M18 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="3.4"/></svg>
      </div>
      <div style="flex:1;">
        <h4>Sugestão da Encaixe IA</h4>
        <p id="ai-texto">Calculando o melhor horário livre do dia...</p>
        <div class="actions">
          <button class="btn btn-primary btn-sm" id="btn-usar-sugestao">Usar esse horário</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Agendamentos do dia</h3>
        <span class="made-by" id="contagem-label"></span>
      </div>
      <div class="agenda-list" id="agenda-list"></div>
    </div>
  </main>
</div>

<button class="fab" id="btn-novo-mobile" aria-label="Novo agendamento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- ===================== MODAL NOVO AGENDAMENTO ===================== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3>Novo agendamento</h3>
      <button class="modal-close" id="modal-close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <form id="form-agendamento">
      <div class="field">
        <label for="f-cliente">Nome do cliente</label>
        <input type="text" id="f-cliente" required placeholder="Ex.: João Pereira">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-telefone">WhatsApp</label>
          <input type="tel" id="f-telefone" required placeholder="81 99999-0000">
        </div>
        <div class="field">
          <label for="f-servico">Serviço</label>
          <select id="f-servico" required></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-data">Data</label>
          <input type="date" id="f-data" required>
        </div>
        <div class="field">
          <label for="f-hora">Horário disponível</label>
          <select id="f-hora" required></select>
        </div>
      </div>

      <div class="field">
        <label>Prévia da confirmação (WhatsApp)</label>
        <div class="wa-preview" id="wa-preview">Preencha os dados pra ver a mensagem.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Confirmar agendamento</button>
    </form>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
