<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agendar horário — Barbearia Vintage</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-body">

<div class="book-shell">

  <div class="book-header">
    <div class="biz-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </div>
    <h1 id="biz-nome">Barbearia Vintage</h1>
    <p>Escolha o serviço, o dia e o horário — a confirmação é na hora.</p>
  </div>

  <div class="book-steps">
    <span class="active" data-step="1"></span>
    <span data-step="2"></span>
    <span data-step="3"></span>
  </div>

  <!-- ETAPA 1 — SERVIÇO -->
  <div id="etapa-servico">
    <div id="lista-servicos"></div>
    <button class="btn btn-primary btn-block" id="btn-ir-horario" disabled>Escolher horário</button>
  </div>

  <!-- ETAPA 2 — DIA E HORÁRIO -->
  <div id="etapa-horario" class="hidden">
    <div class="day-scroll" id="lista-dias"></div>
    <div class="slot-grid" id="lista-slots"></div>
    <button class="btn btn-primary btn-block" id="btn-ir-dados" disabled>Continuar</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" id="btn-voltar-servico">Voltar</button>
  </div>

  <!-- ETAPA 3 — DADOS + CONFIRMAÇÃO -->
  <div id="etapa-dados" class="hidden">
    <div class="summary-card" id="resumo-card"></div>

    <div class="field">
      <label for="c-nome">Seu nome</label>
      <input type="text" id="c-nome" placeholder="Como podemos te chamar?">
    </div>
    <div class="field">
      <label for="c-telefone">WhatsApp</label>
      <input type="tel" id="c-telefone" placeholder="81 99999-0000">
    </div>

    <button class="btn btn-primary btn-block" id="btn-confirmar">Confirmar agendamento</button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" id="btn-voltar-horario">Voltar</button>
  </div>

  <!-- ETAPA 4 — SUCESSO -->
  <div id="etapa-sucesso" class="hidden">
    <div class="success-box">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2>Agendamento confirmado!</h2>
      <p>Guardamos seu horário. Aqui está a mensagem de confirmação:</p>
    </div>
    <div class="wa-preview" id="wa-preview-final"></div>
    <button class="btn btn-ghost btn-block" style="margin-top:18px;" id="btn-novo-agendamento">Fazer outro agendamento</button>
  </div>

</div>

<script src="js/store.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
